<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Портфель облигаций</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <h1>Мой портфель</h1>
</header>

<main class="grid">

  <!-- ====== ВИДЖЕТ 1: КАПИТАЛ И ПОЗИЦИИ ====== -->
  <section class="card widget-capital">
    <h2>Капитал</h2>
    <div class="capital-total">
      <span id="capitalValue">—</span> ₽
    </div>

    <table class="positions">
      <thead>
      <tr>
        <th>Бумага</th>
        <th>Кол-во</th>
        <th>Сумма</th>
      </tr>
      </thead>
      <tbody id="bondsBody">
      <!-- строки добавит JS -->
      </tbody>
    </table>
  </section>

  <!-- ====== ВИДЖЕТ 1: КОШЕЛЕК ====== -->
  <section class="card widget-wallet">
    <h2>Кошелёк</h2>
    <div class="wallet-total">
      <span id="walletValue">—</span> ₽
    </div>

    <div class="wallet-actions">
      <button type="button" id="btnDeposit" class="btn btn-primary">Внести</button>
      <button type="button" id="btnWithdraw" class="btn btn-secondary">Снять</button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {

          // ====== добавление операции ======
          const operationForm = document.getElementById('operationForm');
          const operationMessage = document.getElementById('operationMessage');
          const operationSubmit = document.getElementById('operationSubmit');

          if (operationForm) {
              operationForm.addEventListener('submit', async (e) => {
                  e.preventDefault();   // ← не даём браузеру отправить форму и перезагрузить страницу

                  // Собираем все поля формы в объект
                  const formData = new FormData(operationForm);
                  const payload = {};
                  formData.forEach((value, key) => {
                      payload[key] = value;
                  });

                  // Простая нормализация: пустые строки → null, числа → number
                  const numberFields = [
                      'quantity', 'amount', 'nominal', 'couponAmount', 'couponsPerYear'
                  ];
                  numberFields.forEach(f => {
                      if (payload[f] === '' || payload[f] === undefined) {
                          payload[f] = null;
                      } else {
                          const n = Number(payload[f]);
                          if (!Number.isNaN(n)) payload[f] = n;
                      }
                  });

                  // Дизейблим кнопку, чистим прошлое сообщение
                  operationSubmit.disabled = true;
                  operationMessage.hidden = true;
                  operationMessage.textContent = '';

                  try {
                      const res = await fetch('/api/v1/operation/new', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(payload)
                      });

                      if (!res.ok) {
                          const text = await res.text();
                          throw new Error(text || ('HTTP ' + res.status));
                      }

                      // Очищаем поля, кроме типа бумаги/операции (их удобно оставить)
                      operationForm.reset();
                      updateBondBlock();  // если у тебя есть логика показа блока новой облигации

                      showMessage('Операция добавлена', 'success');

                      // Обновляем таблицу и кошелёк
                      await refreshAll();
                  } catch (err) {
                      showMessage(err.message, 'error');
                  } finally {
                      operationSubmit.disabled = false;
                  }
                  loadWallet();
                  loadBonds();
                  loadCapital();
              });
          }

          function showMessage(text, type) {
              if (!operationMessage) return;
              operationMessage.textContent = text;
              operationMessage.classList.remove('success', 'error');
              operationMessage.classList.add(type);
              operationMessage.hidden = false;
          }

          // ====== элементы ======
          const walletValueEl = document.getElementById('walletValue');
          const btnDeposit    = document.getElementById('btnDeposit');
          const btnWithdraw   = document.getElementById('btnWithdraw');
          const modal         = document.getElementById('walletModal');
          const modalTitle    = document.getElementById('modalTitle');
          const modalAmount   = document.getElementById('modalAmount');
          const modalError    = document.getElementById('modalError');
          const modalCancel   = document.getElementById('modalCancel');
          const modalSubmit   = document.getElementById('modalSubmit');

          let currentAction = null; // 'deposit' | 'withdraw'

          // ====== форматирование ======
          function formatMoney(value) {
              return new Intl.NumberFormat('ru-RU', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
              }).format(value)
                .replace(/\u00A0/g, ' ')
                .replace(',', '.');
          }

          // ====== загрузка списка облигаций ======
          async function loadBonds() {
              const tbody = document.getElementById('bondsBody');
              if (!tbody) return;

              try {
                  const res = await fetch('/api/v1/bond/get_all');
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const bonds = await res.json();

                  if (!bonds || bonds.length === 0) {
                      tbody.innerHTML = '<tr><td colspan="3" class="empty">Пока нет бумаг</td></tr>';
                      return;
                  }

                  tbody.innerHTML = bonds.map(b => `
                      <tr>
                          <td>${escapeHtml(b.name)}</td>
                          <td>${b.count}</td>
                          <td>${formatMoney(b.cost)}</td>
                      </tr>
                  `).join('');
              } catch (e) {
                  console.error('Ошибка загрузки облигаций:', e);
                  tbody.innerHTML = '<tr><td colspan="3" class="empty">Ошибка загрузки</td></tr>';
              }
          }

          async function loadCapital() {
              try {
              const res = await fetch('/api/v1/capital/get_value');
              if (!res.ok) throw new Error('HTTP ' + res.status);
              const data = await res.json();

              const formatted = new Intl.NumberFormat('ru-RU', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
              }).format(data.totalCapital).replace(',', '.');

              document.getElementById('capitalValue').textContent = formatted;
              } catch (e) {
                  console.error('Не удалось загрузить капитал:', e);
                  document.getElementById('capitalValue').textContent = '—';
              }
          }

          // Простая защита от XSS, если имена приходят из пользовательского ввода
          function escapeHtml(s) {
              return String(s)
                  .replaceAll('&', '&amp;')
                  .replaceAll('<', '&lt;')
                  .replaceAll('>', '&gt;')
                  .replaceAll('"', '&quot;')
                  .replaceAll("'", '&#39;');
          }


          // ====== загрузка кошелька ======
          async function loadWallet() {
              try {
                  const res = await fetch('/api/v1/wallet/get_value');
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const data = await res.json();
                  walletValueEl.textContent = formatMoney(data.totalValue);
              } catch (e) {
                  console.error('Ошибка загрузки кошелька:', e);
                  walletValueEl.textContent = '—';
              }
          }

          // ====== открытие модалки ======
          function openModal(action) {
              currentAction = action;
              modalTitle.textContent = action === 'deposit' ? 'Внести средства' : 'Снять средства';
              modalAmount.value = '';
              modalError.hidden = true;
              modalError.textContent = '';
              modal.hidden = false;
              modalAmount.focus();
          }

          function closeModal() {
              modal.hidden = true;
              currentAction = null;
          }

          // ====== отправка ======
          async function submitModal() {
              const amount = parseFloat(modalAmount.value);
              if (!amount || amount <= 0) {
                  showError('Введите положительную сумму');
                  return;
              }

              const url = currentAction === 'deposit'
                  ? '/api/v1/wallet/deposit'
                  : '/api/v1/wallet/withdraw';

              try {
                  const res = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ amount: amount })
                  });

                  if (!res.ok) {
                      const text = await res.text();
                      throw new Error(text || ('HTTP ' + res.status));
                  }

                  const data = await res.json();
                  walletValueEl.textContent = formatMoney(data.totalCapital);
                  closeModal();

                  await loadWallet();
              } catch (e) {
                  showError(e.message);
              }
          }

          function showError(msg) {
              modalError.textContent = msg;
              modalError.hidden = false;
          }

          // ====== обработчики ======
          btnDeposit.addEventListener('click', () => openModal('deposit'));
          btnWithdraw.addEventListener('click', () => openModal('withdraw'));
          modalCancel.addEventListener('click', closeModal);
          modalSubmit.addEventListener('click', submitModal);
          modal.addEventListener('click', (e) => {
              if (e.target === modal) closeModal(); // клик по фону
          });
          document.addEventListener('keydown', (e) => {
              if (e.key === 'Escape' && !modal.hidden) closeModal();
          });

          // ====== старт ======
          loadWallet();
          loadBonds();
          loadCapital();
      });
    </script>
  </section>

  <!-- ====== МОДАЛКА ДЛЯ ПОПОЛНЕНИЯ / СНЯТИЯ ====== -->
  <div id="walletModal" class="modal-overlay" hidden>
    <div class="modal">
      <h3 id="modalTitle">Внести средства</h3>

      <label>
        Сумма
        <input type="number" id="modalAmount" step="0.01" min="0.01" placeholder="0.00">
      </label>

      <div id="modalError" class="modal-error" hidden></div>

      <div class="modal-actions">
        <button type="button" id="modalCancel" class="btn btn-secondary">Отмена</button>
        <button type="button" id="modalSubmit" class="btn btn-primary">Подтвердить</button>
      </div>
    </div>
  </div>

  <!-- ====== ВИДЖЕТ 2: ГРАФИК РОСТА ====== -->
  <section class="card widget-growth">
    <h2>Прогноз роста капитала</h2>
    <canvas id="growthChart"></canvas>
  </section>

  <!-- ====== ВИДЖЕТ 3: ДОБАВЛЕНИЕ ОПЕРАЦИИ ====== -->
  <section class="card widget-operation">
    <h2>Добавить операцию</h2>

    <form id="operationForm">
      <!-- Название бумаги -->
      <label>
        Название бумаги
        <input type="text" name="name" list="securitiesList" required>
        <datalist id="securitiesList">
          <option value="ОФЗ 26238">ОФЗ 26238 (Облигация)</option>
          <option value="ОФЗ 26240">ОФЗ 26240 (Облигация)</option>
          <option value="Корп. облигация X">Корп. облигация X (Облигация)</option>
        </datalist>
      </label>

      <!-- Тип бумаги -->
      <label>
        Тип бумаги
        <select name="securityType" id="securityType" required>
          <option value="BOND">Облигация</option>
          <option value="STOCK">Акция</option>
        </select>
      </label>

      <!-- Тип операции -->
      <label>
        Тип операции
        <select name="operationType" required>
          <option value="BUY">Покупка</option>
          <option value="SELL">Продажа</option>
          <option value="COUPON">Купон</option>
          <option value="REDEMPTION">Погашение</option>
        </select>
      </label>

      <label>
        Количество
        <input type="number" step="any" name="count" required>
      </label>

      <label>
        Сумма
        <input type="number" step="any" name="cost" required>
      </label>

      <fieldset id="bondDetails">
        <legend>Информация о новой облигации</legend>

        <label>
          Номинал
          <input type="number" step="any" name="nominal_value">
        </label>

        <label>
          Размер купона
          <input type="number" step="any" name="coupon">
        </label>

        <label>
          Дата погашения
          <input type="date" name="maturity_date">
        </label>

        <label>
          Выплат к погашению
          <input type="number" min="1" max="999" name="payout">
        </label>
      </fieldset>

      <!-- блок для ошибок/успеха -->
      <div id="operationMessage" class="form-message" hidden></div>

      <button type="submit" id="operationSubmit">Добавить</button>
    </form>
  </section>
</main>

<script src="/portfolio.js"></script>
</body>
</html>
