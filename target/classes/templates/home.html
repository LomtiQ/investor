      function formatMoney(value) {
          return new Intl.NumberFormat('ru-RU', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
          }).format(value)
            .replace(/\u00A0/g, ' ')
            .replace(',', '.');
      }

      function escapeHtml(s) {
          return String(s)
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')
              .replaceAll("'", '&#39;');
      }

      function formatDateRu(iso) {
          return new Date(iso).toLocaleDateString('ru-RU', {
              day: '2-digit', month: 'short', year: 'numeric'
          });
      }

              const data = await res.json();
              renderGrowthChart(data);
          } catch (e) {
              console.error('Ошибка загрузки прогноза:', e);
          }
      }

      function renderGrowthChart(data) {
    const canvas = document.getElementById('growthChart');
    if (!canvas) return;

    // Формат {x, y} — так Chart.js с time scale работает быстро
    const chartData = data.points.map(p => ({
        x: p.date,
        y: p.value,
        event: p.event
    }));

    // Уничтожаем старый инстанс, чтобы не плодить графики
    if (growthChartInstance) {
        growthChartInstance.destroy();
        growthChartInstance = null;
    }

    const ctx = canvas.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 320);
    gradient.addColorStop(0, 'rgba(43, 138, 62, 0.25)');
    gradient.addColorStop(1, 'rgba(43, 138, 62, 0)');

    growthChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: 'Капитал, ₽',
                data: chartData,
                borderColor: '#2b8a3e',
                backgroundColor: gradient,
                borderWidth: 3, // Сделал линию чуть толще для наглядности
                fill: true,
                tension: 0.1, // Легкое сглаживание
                pointRadius: 4, // Показываем точки, так как их всего 14
                pointBackgroundColor: '#2b8a3e',
                pointHoverRadius: 7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            // Указываем Chart.js, где искать данные в объекте
            parsing: {
                xAxisKey: 'x',
                yAxisKey: 'y'
            },
            interaction: {
                mode: 'index',
                intersect: false
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: (ctx) => formatDateRu(ctx[0].raw.x),
                        label: (ctx) => {
                            const p = ctx.raw;
                            const base = ' ' + formatMoney(p.y);
                            return p.event ? `${base} — ${p.event}` : base;
                        }
                    }
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'month', // Так как данные у вас помесячные, ставим месяц
                        displayFormats: {
                            month: 'LLL yyyy' // Формат: Ноябрь 2026
                        },
                        tooltipFormat: 'dd.MM.yyyy'
                    },
                    grid: { display: false }
                },
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: (val) => formatMoney(val)
                    }
                }
            }
        }
    });
}

      // ======================================================
      // UI + ЗАГРУЗКА ДАННЫХ
      // ======================================================

      document.addEventListener('DOMContentLoaded', () => {

          // Запускаем график
          loadForecast();

          // ====== добавление операции ======
          const operationForm = document.getElementById('operationForm');
          const operationMessage = document.getElementById('operationMessage');
          const operationSubmit = document.getElementById('operationSubmit');

          if (operationForm) {
              operationForm.addEventListener('submit', async (e) => {
                  e.preventDefault();

                  const formData = new FormData(operationForm);
                  const payload = {};
                  formData.forEach((value, key) => {
                      payload[key] = value;
                  });

                  const numberFields = [
                      'quantity', 'amount', 'nominal', 'couponAmount', 'couponsPerYear'
                  ];
                  numberFields.forEach(f => {
                      if (payload[f] === '' || payload[f] === undefined) {
                          payload[f] = null;
                      } else {
                          const n = Number(payload[f]);
                          if (!Number.isNaN(n)) payload[f] = n;
                      }
                  });

                  operationSubmit.disabled = true;
                  operationMessage.hidden = true;
                  operationMessage.textContent = '';

                  try {
                      const res = await fetch('/api/v1/operation/new_operation', {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify(payload)
                      });

                      if (!res.ok) {
                          const text = await res.text();
                          throw new Error(text || ('HTTP ' + res.status));
                      }

                      operationForm.reset();
                      if (typeof updateBondBlock === 'function') updateBondBlock();

                      showMessage('Операция добавлена', 'success');

                      await refreshAll();
                  } catch (err) {

                  } finally {
                      operationSubmit.disabled = false;
                  }

                  loadWallet();
                  loadBonds();
                  loadCapital();
                  loadForecast();
              });
          }

          function showMessage(text, type) {
              if (!operationMessage) return;
              operationMessage.textContent = text;
              operationMessage.classList.remove('success', 'error');
              operationMessage.classList.add(type);
              operationMessage.hidden = false;
          }

          // ====== элементы кошелька ======
          const walletValueEl = document.getElementById('walletValue');
          const btnDeposit    = document.getElementById('btnDeposit');
          const btnWithdraw   = document.getElementById('btnWithdraw');
          const modal         = document.getElementById('walletModal');
          const modalTitle    = document.getElementById('modalTitle');
          const modalAmount   = document.getElementById('modalAmount');
          const modalError    = document.getElementById('modalError');
          const modalCancel   = document.getElementById('modalCancel');
          const modalSubmit   = document.getElementById('modalSubmit');

          let currentAction = null;

          // ====== облигации ======
          const bondsCache = new Map();
          let bondKeyCounter = 0;

          async function loadBonds() {
              const tbody = document.getElementById('bondsBody');
              if (!tbody) return;

              try {
                  const res = await fetch('/api/v1/bond/get_all');
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const bonds = await res.json();

                  if (!bonds || bonds.length === 0) {
                      tbody.innerHTML = '<tr><td colspan="3" class="empty">Пока нет бумаг</td></tr>';
                      return;
                  }

                  tbody.innerHTML = bonds.map(b => {
                      const key = 'b' + (bondKeyCounter++);
                      bondsCache.set(key, b);
                      return `
                          <tr>
                              <td>
                                  <span class="bond-name-link" data-bond-key="${key}">
                                      ${escapeHtml(b.name)}
                                  </span>
                              </td>
                              <td>${b.count}</td>
                              <td>${formatMoney(b.cost)}</td>
                          </tr>
                      `;
                  }).join('');

                  bindBondRowClicks(tbody);
              } catch (e) {
                  console.error('Ошибка загрузки облигаций:', e);
                  tbody.innerHTML = '<tr><td colspan="3" class="empty">Ошибка загрузки</td></tr>';
              }
          }

          function bindBondRowClicks(tbody) {
              tbody.querySelectorAll('.bond-name-link').forEach(el => {
                  el.addEventListener('click', () => {
                      const key = el.dataset.bondKey;
                      const bond = bondsCache.get(key);
                      if (bond) openBondModal(bond);
                  });
              });
          }

          function openBondModal(bond) {
              const bondModal = document.getElementById('bondModal');
              const title = document.getElementById('bondModalTitle');
              const body = document.getElementById('bondModalBody');

              title.textContent = bond.name || 'Без названия';

              const fields = [
                  { label: 'Номинал', value: bond.nominal_value },
                  { label: 'Дата погашения', value: bond.maturity_date },
                  { label: 'Купон', value: bond.coupon },
                  { label: 'Количество', value: bond.count },
                  { label: 'Стоимость', value: formatMoney(bond.cost) },
                  { label: 'Выплата', value: bond.payout }
              ];

              body.innerHTML = fields
                  .filter(f => f.value !== undefined && f.value !== null && f.value !== '')
                  .map(f => `
                      <div class="bond-info-row">
                          <span class="bond-info-label">${escapeHtml(f.label)}</span>
                          <span class="bond-info-value">${escapeHtml(String(f.value))}</span>
                      </div>
                  `).join('');

              bondModal.hidden = false;
          }

          function closeBondModal() {
              const bondModal = document.getElementById('bondModal');
              if (bondModal) bondModal.hidden = true;
          }

          window.closeBondModal = closeBondModal;

          // Закрытие bond-модалки
          const bondModalEl = document.getElementById('bondModal');
          if (bondModalEl) {
              bondModalEl.addEventListener('click', (e) => {
                  if (e.target === bondModalEl) closeBondModal();
              });
              document.addEventListener('keydown', (e) => {
                  if (e.key === 'Escape' && !bondModalEl.hidden) closeBondModal();
              });
          }

          // ====== капитал ======
          async function loadCapital() {
              try {
                  const res = await fetch('/api/v1/capital/get_value');
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const data = await res.json();

                  const formatted = new Intl.NumberFormat('ru-RU', {
                      minimumFractionDigits: 2,
                      maximumFractionDigits: 2
                  }).format(data.totalCapital).replace(',', '.');

                  const el = document.getElementById('capitalValue');
                  if (el) el.textContent = formatted;
              } catch (e) {
                  console.error('Не удалось загрузить капитал:', e);
                  const el = document.getElementById('capitalValue');
                  if (el) el.textContent = '—';
              }
          }

          // ====== кошелёк ======
          async function loadWallet() {
              if (!walletValueEl) return;
              try {
                  const res = await fetch('/api/v1/wallet/get_value');
                  if (!res.ok) throw new Error('HTTP ' + res.status);
                  const data = await res.json();
                  walletValueEl.textContent = formatMoney(data.totalValue);
              } catch (e) {
                  console.error('Ошибка загрузки кошелька:', e);
                  walletValueEl.textContent = '—';
              }
          }

          // ====== модалка кошелька ======
          function openWalletModal(action) {
              currentAction = action;
              modalTitle.textContent = action === 'deposit' ? 'Внести средства' : 'Снять средства';
              modalAmount.value = '';
              modalError.hidden = true;
              modalError.textContent = '';
              modal.hidden = false;
              modalAmount.focus();
          }

          function closeWalletModal() {
              modal.hidden = true;
              currentAction = null;
          }

          async function submitWalletModal() {
              const amount = parseFloat(modalAmount.value);
              if (!amount || amount <= 0) {
                  showError('Введите положительную сумму');
                  return;
              }

              const url = currentAction === 'deposit'
                  ? '/api/v1/wallet/deposit'
                  : '/api/v1/wallet/withdraw';

              try {
                  const res = await fetch(url, {
                      method: 'POST',
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ amount: amount })
                  });

                  if (!res.ok) {
                      const text = await res.text();
                      throw new Error(text || ('HTTP ' + res.status));
                  }

                  const data = await res.json();
                  walletValueEl.textContent = formatMoney(data.totalCapital);
                  closeWalletModal();

                  await loadWallet();
              } catch (e) {
                  showError(e.message);
              }
          }

          function showError(msg) {
              modalError.textContent = msg;
              modalError.hidden = false;
          }

          // Обработчики кошелька
          if (btnDeposit)  btnDeposit.addEventListener('click', () => openWalletModal('deposit'));
          if (btnWithdraw) btnWithdraw.addEventListener('click', () => openWalletModal('withdraw'));
          if (modalCancel) modalCancel.addEventListener('click', closeWalletModal);
          if (modalSubmit) modalSubmit.addEventListener('click', submitWalletModal);
          if (modal) {
              modal.addEventListener('click', (e) => {
                  if (e.target === modal) closeWalletModal();
              });
              document.addEventListener('keydown', (e) => {
                  if (e.key === 'Escape' && !modal.hidden) closeWalletModal();
              });
          }

          // ====== старт ======
          loadWallet();
          loadBonds();
          loadCapital();
      });
    </script>

    <form id="operationForm">

      <label>
        Название бумаги
        <input type="text" name="name" list="securitiesList" required>
        <datalist id="securitiesList">
          <option value="ОФЗ 26238">ОФЗ 26238 (Облигация)</option>
          <option value="ОФЗ 26240">ОФЗ 26240 (Облигация)</option>
          <option value="Корп. облигация X">Корп. облигация X (Облигация)</option>
        </datalist>
      </label>

      <!-- Тип бумаги -->
      <label>
        Тип бумаги
        <select name="securityType" id="securityType" required>
          <option value="BOND">Облигация</option>
          <option value="STOCK">Акция</option>
        </select>
      </label>

      <!-- Тип операции -->
      <label>
        Тип операции
        <select name="operationType" required>
          <option value="BUY">Покупка</option>
          <option value="SELL">Продажа</option>
          <option value="COUPON">Купон</option>
          <option value="REDEMPTION">Погашение</option>
        </select>
      </label>

      <label>
        Количество
        <input type="number" step="any" name="count" required>
      </label>

      <label>
        Сумма
        <input type="number" step="any" name="cost" required>
      </label>

      <fieldset id="bondDetails">
        <legend>Информация о новой облигации</legend>

        <label>
          Номинал
          <input type="number" step="any" name="nominal_value">
        </label>

        <label>
          Размер купона
          <input type="number" step="any" name="coupon">
        </label>

        <label>
          Дата погашения
          <input type="date" name="maturity_date">
        </label>

        <label>
          Выплат к погашению
          <input type="number" min="1" max="999" name="payout">
        </label>
      </fieldset>

      <!-- блок для ошибок/успеха -->
      <div id="operationMessage" class="form-message" hidden></div>

      <button type="submit" id="operationSubmit">Добавить</button>
    </form>
  </section>
</main>
